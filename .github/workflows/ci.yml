name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test simulator
        run: cargo test --locked --workspace
      - name: Build Sketchpad
        run: ./build.sh
      - name: Test Sketchpad interactions
        working-directory: sketchpad-web
        run: npm test
