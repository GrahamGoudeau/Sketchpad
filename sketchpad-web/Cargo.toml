[package]
name = "sketchpad-web"
description = "Sketchpad-focused TX-2 WebAssembly runtime"
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE-MIT"
publish = false
repository = "https://github.com/GrahamGoudeau/Sketchpad.git"

[lib]
path = "rust/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
base = { path = "../base" }
console_error_panic_hook = { version = "0.1.7", optional = true }
cpu = { path = "../cpu" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
